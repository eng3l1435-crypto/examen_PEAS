readme = "README.md"
authors = [
    { name = "angel_hernandez", email = "eng3l1435@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "customtkinter>=6.0.0",
    "fpdf2>=2.8.9",
    "matplotlib>=3.11.2",
    "ollama>=0.6.3",
